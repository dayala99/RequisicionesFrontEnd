<h2 mat-dialog-title>Registrar usuario</h2>

<form class="usuario-edit" [formGroup]="form" (ngSubmit)="guardar()">
  <div mat-dialog-content class="usuario-edit__content">
    <p class="usuario-edit__description">
      Ingresa los datos del nuevo usuario. El registro se enviara al backend.
    </p>

    <label class="usuario-edit__field">
      <span>Codigo</span>
      <input type="text" formControlName="usrCod">
      <small class="usuario-edit__error" *ngIf="form.controls['usrCod'].touched && (form.controls['usrCod'].hasError('required') || form.controls['usrCod'].hasError('whitespace'))">Campo Codigo obligatorio.</small>
      <small class="usuario-edit__error" *ngIf="form.controls['usrCod'].touched && form.controls['usrCod'].hasError('pattern')">Formato invalido.</small>
    </label>

    <label class="usuario-edit__field">
      <span>Nombre</span>
      <input type="text" formControlName="usrNom">
      <small class="usuario-edit__error" *ngIf="form.controls['usrNom'].touched && (form.controls['usrNom'].hasError('required') || form.controls['usrNom'].hasError('whitespace'))">Campo Nombre obligatorio.</small>
    </label>

    <p *ngIf="errorMessage" class="usuario-edit__error">
      {{ errorMessage }}
    </p>
  </div>

  <div mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cerrar()" [disabled]="isSaving">
      Cancelar
    </button>

    <button mat-raised-button color="primary" type="submit" [disabled]="isSaving">
      {{ isSaving ? 'Registrando...' : 'Registrar usuario' }}
    </button>
  </div>
</form>
