<div class="dialog-card">
  <header class="dialog-card__header">
    <div>
      <p class="dialog-card__eyebrow">Administracion</p>
      <h2>{{ esEdicion ? 'Editar Jefe' : 'Nuevo Jefe' }}</h2>
      <p class="dialog-card__description">
        {{ esEdicion ? 'Actualiza el nombre, DNI y área del jefe.' : 'Registra un nuevo jefe con nombre, DNI y área.' }}
      </p>
    </div>

    <button type="button" class="dialog-card__close" (click)="cerrar()" aria-label="Cerrar">&times;</button>
  </header>

  <p *ngIf="cargandoDatosJefe" class="dialog-loading">Cargando información del jefe...</p>

  <form class="dialog-form" [formGroup]="form" (ngSubmit)="guardar()">
    <div class="dialog-grid">
      <label class="field">
        <span>Nombre</span>
        <input type="text" formControlName="nombre" placeholder="Ingrese Nombre">
      </label>

      <label class="field">
        <span>DNI</span>
        <input type="text" formControlName="dni" maxlength="8" placeholder="Ingrese DNI">
      </label>

      <label class="field field--full">
        <span>Área</span>
        <select formControlName="cenCosId">
          <option [ngValue]="null">Seleccione un área</option>
          <option *ngFor="let centro of centroCostos" [ngValue]="centro.id">{{ centro.descripcion }}</option>
        </select>
      </label>

      <label class="field field--full" *ngIf="esEdicion">
        <span>Estado</span>
        <select formControlName="estado">
          <option value="A">Activo</option>
          <option value="I">Inactivo</option>
        </select>
      </label>
    </div>

    <p *ngIf="saveError" class="dialog-error">{{ saveError }}</p>

    <footer class="dialog-actions">
      <button type="button" class="btn btn-secondary" (click)="cerrar()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="guardando || cargandoCentrosCosto || cargandoDatosJefe">
        {{ guardando ? 'Guardando...' : (esEdicion ? 'Actualizar' : 'Guardar') }}
      </button>
    </footer>
  </form>
</div>
