<form class="item-dialog" [formGroup]="form" (ngSubmit)="guardar()">
  <h2 mat-dialog-title>Nuevo Item</h2>

  <mat-dialog-content class="item-dialog__content">
    <p class="item-dialog__description">
      Registra un nuevo item y asignale el grupo correspondiente. El estado inicial siempre sera activo.
    </p>

    <label class="item-dialog__field">
      <span>Descripcion</span>
      <input type="text" formControlName="itmDes" maxlength="120">
      <small class="item-dialog__error" *ngIf="form.controls['itmDes'].touched && (form.controls['itmDes'].hasError('required') || form.controls['itmDes'].hasError('whitespace'))">Campo Descripcion obligatorio.</small>
    </label>

    <label class="item-dialog__field">
      <span>Grupo</span>
      <div class="item-dialog__combobox" [class.item-dialog__combobox--open]="isGrupoDropdownOpen">
        <input
          type="text"
          formControlName="itmGrp"
          autocomplete="off"
          [disabled]="isLoadingGroups || !gruposItem.length"
          placeholder="Escribe o selecciona un grupo"
          (focus)="openGrupoDropdown()"
          (blur)="closeGrupoDropdown()"
          (input)="onGrupoInput()">
        <button type="button" class="item-dialog__combobox-toggle" (click)="toggleGrupoDropdown()" tabindex="-1" aria-label="Mostrar grupos">
          <span class="item-dialog__combobox-chevron"></span>
        </button>

        <div *ngIf="isGrupoDropdownOpen && !isLoadingGroups && gruposItem.length" class="item-dialog__combobox-panel">
          <button
            *ngFor="let grupo of filteredGrupoOptions"
            type="button"
            class="item-dialog__combobox-option"
            (mousedown)="selectGrupo(grupo)">
            {{ grupo }}
          </button>

          <div *ngIf="!filteredGrupoOptions.length" class="item-dialog__combobox-empty">
            No hay coincidencias
          </div>
        </div>
        <small class="item-dialog__error" *ngIf="form.controls['itmGrp'].touched && (form.controls['itmGrp'].hasError('required') || form.controls['itmGrp'].hasError('whitespace'))">Campo Grupo obligatorio.</small>
      </div>
    </label>

    <p *ngIf="isLoadingGroups" class="item-dialog__hint">Cargando grupos de item...</p>
    <p *ngIf="errorMessage" class="item-dialog__error">{{ errorMessage }}</p>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="item-dialog__actions">
    <button mat-stroked-button type="button" (click)="cerrar()" [disabled]="isSaving">Cancelar</button>
    <button mat-flat-button color="primary" type="submit" [disabled]="isSaving || isLoadingGroups || !gruposItem.length">
      {{ isSaving ? 'Guardando...' : 'Guardar' }}
    </button>
  </mat-dialog-actions>
</form>
