<section class="supplier-card">
  <header class="supplier-header">
    <div class="supplier-header__copy">
      <p class="eyebrow">Formulario</p>
      <h2>Datos de Proveedor</h2>
    </div>

    <button
      type="button"
      class="eventual-button"
      [class.eventual-button--active]="isEventualMode"
      (click)="toggleEventual()">
      {{ isEventualMode ? 'Desactivar eventual' : 'Activar eventual' }}
    </button>
  </header>

  <form class="supplier-form" [formGroup]="form">
    <div class="form-row form-row--top">
      <label class="field-group field-group--supplier">
        <span class="field-label">Proveedor</span>
        <div class="selector-wrap">
          <button
            type="button"
            class="code-trigger"
            (click)="openProviderDialog()"
            [disabled]="isEventualMode"
            aria-label="Seleccionar proveedor">
            {{ supplierCode }}
          </button>
          <input
            type="text"
            formControlName="supplierName"
            placeholder="Seleccione un proveedor o active Eventual" />
        </div>
      </label>

      <label class="field-group">
        <span class="field-label">Telefono</span>
        <input type="text" formControlName="phone" />
      </label>
    </div>

    <div class="form-row">
      <label class="field-group field-group--wide">
        <span class="field-label">Direccion</span>
        <input type="text" formControlName="address" />
      </label>

      <label class="field-group">
        <span class="field-label">Contacto</span>
        <input type="text" formControlName="contact" />
      </label>
    </div>

    <div class="form-row">
      <label class="field-group field-group--medium">
        <span class="field-label">RUC</span>
        <input type="text" formControlName="ruc" />
      </label>

      <label class="field-group field-group--payment">
        <span class="field-label">Forma de Pago</span>
        <div class="selector-wrap">
          <button
            type="button"
            class="code-trigger"
            (click)="openPaymentDialog()"
            aria-label="Seleccionar forma de pago">
            {{ paymentCode }}
          </button>
          <input
            type="text"
            formControlName="paymentDescription"
            placeholder="Seleccione una forma de pago" />
        </div>
      </label>
    </div>
  </form>
</section>
